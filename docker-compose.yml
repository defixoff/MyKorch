services:
  korch:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      KORCH_JWT_SECRET: "replace-with-a-long-random-secret"
      DATABASE_URL: "postgresql://korch:korch@postgres:5432/korch"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: korch
      POSTGRES_PASSWORD: korch
      POSTGRES_DB: korch
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U korch -d korch"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
